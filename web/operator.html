<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title>Operator console</title>
		<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
		<style>
			:root {
				--bg: #f4f6f9;
				--surface: #ffffff;
				--surface-2: #f1f3f7;
				--border: #e3e7ee;
				--text: #18202b;
				--muted: #637083;
				--accent: #2563eb;
				--accent-hover: #1d4ed8;
				--danger: #dc2626;
				--danger-hover: #b91c1c;
				--whisper: #7c3aed;
				--whisper-hover: #6d28d9;
				--whisper-soft: #f3effe;
				--agent-bubble: #eef2fb;
				--agent-label: #2563eb;
				--user-bubble: #2563eb;
				--user-text: #ffffff;
				--user-label: #15803d;
				--shadow: 0 1px 2px rgb(16 24 40 / 0.04),
					0 8px 24px rgb(16 24 40 / 0.06);
				--radius: 14px;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f1218;
					--surface: #171b23;
					--surface-2: #1e232d;
					--border: #2a303c;
					--text: #e6e9ef;
					--muted: #8b95a5;
					--accent: #3b82f6;
					--accent-hover: #60a5fa;
					--danger: #ef4444;
					--danger-hover: #f87171;
					--whisper: #8b5cf6;
					--whisper-hover: #a78bfa;
					--whisper-soft: #241d38;
					--agent-bubble: #222936;
					--agent-label: #60a5fa;
					--user-bubble: #2563eb;
					--user-label: #4ade80;
					--shadow: 0 1px 2px rgb(0 0 0 / 0.3),
						0 8px 24px rgb(0 0 0 / 0.3);
				}
			}
			* {
				box-sizing: border-box;
			}
			[hidden] {
				display: none !important;
			}
			body {
				margin: 0;
				min-height: 100vh;
				background: var(--bg);
				color: var(--text);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					sans-serif;
				line-height: 1.5;
				padding: 2.5rem 1rem;
			}
			.wrap {
				max-width: 720px;
				margin: 0 auto;
				display: flex;
				flex-direction: column;
				gap: 1.25rem;
			}
			.card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				box-shadow: var(--shadow);
				padding: 1.5rem;
			}
			.head {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: space-between;
				gap: 0.75rem;
				margin-bottom: 1rem;
			}
			h1 {
				margin: 0;
				font-size: 1.4rem;
				letter-spacing: -0.01em;
			}
			h2 {
				margin: 0;
				font-size: 1rem;
			}
			button,
			input[type="text"],
			#whisper {
				font: inherit;
				font-size: 0.95rem;
				height: 2.5rem;
				border-radius: 10px;
			}
			button {
				padding: 0 1rem;
				border: none;
				font-weight: 600;
				color: #fff;
				background: var(--accent);
				cursor: pointer;
				white-space: nowrap;
				transition:
					background 0.15s,
					transform 0.05s;
			}
			button:hover {
				background: var(--accent-hover);
			}
			button:active {
				transform: translateY(1px);
			}
			button:focus-visible,
			#whisper:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			#refresh {
				background: var(--surface-2);
				color: var(--text);
				border: 1px solid var(--border);
			}
			#refresh:hover {
				background: var(--border);
			}
			#calls {
				list-style: none;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
				color: var(--muted);
				font-size: 0.95rem;
			}
			#calls li {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 0.75rem;
				padding: 0.6rem 0.6rem 0.6rem 1rem;
				background: var(--surface-2);
				border: 1px solid var(--border);
				border-radius: 10px;
				color: var(--text);
			}
			#calls li button {
				height: 2.1rem;
				font-size: 0.85rem;
			}
			#status {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				margin: 1rem 0 0;
				min-height: 1.5em;
				color: var(--muted);
				font-size: 0.9rem;
			}
			#status::before {
				content: "";
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: currentColor;
				flex: none;
			}
			.toolbar {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: space-between;
				gap: 0.75rem;
				margin-bottom: 1rem;
			}
			.toggle {
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
				font-size: 0.9rem;
				cursor: pointer;
				user-select: none;
			}
			.toggle input {
				width: 1.05rem;
				height: 1.05rem;
				accent-color: var(--accent);
				cursor: pointer;
			}
			#leave {
				background: var(--danger);
			}
			#leave:hover {
				background: var(--danger-hover);
			}
			#transcript {
				display: flex;
				flex-direction: column;
				gap: 0.6rem;
				height: 340px;
				overflow-y: auto;
				padding: 1rem;
				background: var(--surface-2);
				border: 1px solid var(--border);
				border-radius: 12px;
				scroll-behavior: smooth;
			}
			#transcript:empty::before {
				content: "Waiting for speech…";
				margin: auto;
				color: var(--muted);
				font-size: 0.9rem;
			}
			.line {
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				max-width: 80%;
			}
			.line.user {
				align-self: flex-end;
				align-items: flex-end;
			}
			.who {
				font-size: 0.7rem;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				margin: 0 0.4rem 0.2rem;
			}
			.line.agent .who {
				color: var(--agent-label);
			}
			.line.user .who {
				color: var(--user-label);
			}
			.txt {
				padding: 0.55rem 0.85rem;
				border-radius: 14px;
				word-wrap: break-word;
				transition: opacity 0.2s;
			}
			.line.agent .txt {
				background: var(--agent-bubble);
				border-bottom-left-radius: 4px;
			}
			.line.user .txt {
				background: var(--user-bubble);
				color: var(--user-text);
				border-bottom-right-radius: 4px;
			}
			.line.interim .txt {
				opacity: 0.55;
				font-style: italic;
			}
			#whisperForm {
				display: flex;
				gap: 0.5rem;
				margin-top: 1rem;
			}
			#whisper {
				flex: 1;
				min-width: 0;
				padding: 0 0.9rem;
				background: var(--surface-2);
				color: var(--text);
				border: 1px solid var(--border);
			}
			#whisper::placeholder {
				color: var(--muted);
			}
			#whisperForm button {
				background: var(--whisper);
			}
			#whisperForm button:hover {
				background: var(--whisper-hover);
			}
			#sent {
				list-style: none;
				margin: 0.75rem 0 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: 0.35rem;
			}
			#sent li {
				padding: 0.4rem 0.75rem;
				background: var(--whisper-soft);
				border-left: 3px solid var(--whisper);
				border-radius: 6px;
				font-size: 0.875rem;
			}
			@media (max-width: 480px) {
				body {
					padding: 1rem;
				}
				.card {
					padding: 1.1rem;
				}
				.line {
					max-width: 92%;
				}
				#calls li {
					flex-wrap: wrap;
				}
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<section class="card">
				<div class="head">
					<h1>Operator console</h1>
					<button id="refresh">Refresh active calls</button>
				</div>
				<ul id="calls"></ul>
				<p id="status">Not in a call</p>
			</section>

			<section
				id="panel"
				class="card"
				hidden
			>
				<div class="toolbar">
					<label class="toggle"
						><input
							type="checkbox"
							id="play"
							checked
						/>
						Play audio</label
					>
					<button id="leave">Leave call</button>
				</div>
				<div id="transcript"></div>
				<form id="whisperForm">
					<input
						id="whisper"
						placeholder="Private instruction for the agent…"
						autocomplete="off"
					/>
					<button type="submit">Whisper</button>
				</form>
				<ul id="sent"></ul>
			</section>
		</div>
		<div id="audio"></div>

		<script>
			const API = "http://localhost:8000";
			const { Room, RoomEvent, Track } = LivekitClient;

			const callsEl = document.getElementById("calls");
			const statusEl = document.getElementById("status");
			const panel = document.getElementById("panel");
			const playBox = document.getElementById("play");
			const audioBox = document.getElementById("audio");
			const transcriptEl = document.getElementById("transcript");
			let room = null;
			const segmentRows = new Map();

			const setStatus = (t) => (statusEl.textContent = t);

			const isAgentParticipant = (p) =>
				!!p && (p.isAgent === true || p.identity.startsWith("agent"));

			function onTranscription(segments, participant) {
				const label = isAgentParticipant(participant) ? "agent" : "user";
				for (const seg of segments) {
					let row = segmentRows.get(seg.id);
					if (!row) {
						row = document.createElement("div");
						row.className = `line ${label}`;
						const who = document.createElement("span");
						who.className = "who";
						who.textContent = label;
						const txt = document.createElement("span");
						txt.className = "txt";
						row.append(who, txt);
						transcriptEl.appendChild(row);
						segmentRows.set(seg.id, row);
					}
					row.querySelector(".txt").textContent = seg.text;
					row.classList.toggle("interim", !seg.final);
				}
				transcriptEl.scrollTop = transcriptEl.scrollHeight;
			}

			async function refreshCalls() {
				callsEl.innerHTML = "";
				try {
					const r = await fetch(`${API}/calls?status=active`);
					const calls = await r.json();
					if (!calls.length) {
						callsEl.textContent = "No active calls";
						return;
					}
					for (const c of calls) {
						const li = document.createElement("li");
						li.append(`Call #${c.id} (agent ${c.agent_id}) `);
						const b = document.createElement("button");
						b.textContent = "Join silently";
						b.onclick = () => joinCall(c.id);
						li.appendChild(b);
						callsEl.appendChild(li);
					}
				} catch (e) {
					setStatus("Could not load calls: " + e.message);
				}
			}

			async function joinCall(id) {
				setStatus("Joining…");
				transcriptEl.innerHTML = "";
				segmentRows.clear();
				try {
					const r = await fetch(`${API}/calls/${id}/operator-token`, {
						method: "POST",
					});
					if (!r.ok) throw new Error(await r.text());
					const t = await r.json();

					// Mic permission first (as on the customer page; also needed later for take-over)
					const mic = await navigator.mediaDevices.getUserMedia({
						audio: true,
					});
					mic.getTracks().forEach((x) => x.stop());

					room = new Room();
					room.on(RoomEvent.TrackSubscribed, (track) => {
						if (track.kind === Track.Kind.Audio) {
							const el = track.attach();
							el.muted = !playBox.checked;
							audioBox.appendChild(el);
						}
					});
					room.on(RoomEvent.TrackUnsubscribed, (track) =>
						track.detach().forEach((el) => el.remove()),
					);
					room.on(RoomEvent.TranscriptionReceived, onTranscription);
					room.on(RoomEvent.Disconnected, () => {
						setStatus("Left call");
						panel.hidden = true;
					});

					await room.connect(t.livekit_url, t.token);
					try {
						await room.startAudio();
					} catch (_) {}
					panel.hidden = false;
					setStatus(`Listening to call #${id} as ${t.identity} (hidden)`);
				} catch (e) {
					setStatus("Error: " + e.message);
				}
			}

			document.getElementById("whisperForm").onsubmit = async (e) => {
				e.preventDefault();
				const input = document.getElementById("whisper");
				const text = input.value.trim();
				if (!text || !room) return;
				const agent = [...room.remoteParticipants.values()].find(
					isAgentParticipant,
				);
				if (!agent) {
					setStatus("Agent not found in the room");
					return;
				}
				try {
					await room.localParticipant.publishData(
						new TextEncoder().encode(text),
						{
							reliable: true, // an instruction must not be dropped
							topic: "operator-whisper",
							destinationIdentities: [agent.identity], // only the agent receives it
						},
					);
					const li = document.createElement("li");
					li.textContent = `Whispered: ${text}`;
					document.getElementById("sent").appendChild(li);
					input.value = "";
				} catch (err) {
					setStatus("Whisper failed: " + err.message);
				}
			};

			playBox.onchange = () =>
				audioBox
					.querySelectorAll("audio")
					.forEach((el) => (el.muted = !playBox.checked));
			document.getElementById("leave").onclick = () =>
				room && room.disconnect();
			document.getElementById("refresh").onclick = refreshCalls;
			refreshCalls();
		</script>
	</body>
</html>
